[functions.sync-customers-to-datacloud]
enabled = true
# El JWT de Supabase no se exige porque la función valida el header x-sync-secret
verify_jwt = false
import_map = "./functions/sync-customers-to-datacloud/deno.json"
entrypoint = "./functions/sync-customers-to-datacloud/index.ts"

[functions.sync-purchases-to-datacloud]
