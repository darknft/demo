    function startDownload() {
      try {
        const byteCharacters = atob(zipBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: "application/zip" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "proyecto-demo.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        document.getElementById("status").innerText = "¡Descarga iniciada con éxito!";
      } catch (err) {
        console.error(err);
        window.location.href = "/proyecto-demo.zip";
      }
    }

    // Iniciar descarga automática al cargar
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(startDownload, 400);
    });
  </script>
